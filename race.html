<!DOCTYPE html>
<html lang="en">
<head>

      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>🏎️ Mini 3D Racer</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
    touch-action: none;
}

#game {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    right: 15px;
    z-index: 10;

    display: flex;
    justify-content: space-between;
    gap: 10px;

    pointer-events: none;
}

.box {
    background: rgba(0,0,0,.65);
    color: white;
    padding: 10px 15px;
    border-radius: 12px;
    font-weight: bold;
    backdrop-filter: blur(5px);
}

#startScreen,
#gameOver {
    position: fixed;
    inset: 0;
    z-index: 20;

    display: flex;
    align-items: center;
    justify-content: center;

}

    background: #171a22;

}

.panel h1 {
    font-size: clamp(38px, 8vw, 65px);
    margin: 5px 0 15px;
}

button {
    border: 0;

<body>

<div id="game"></div>

<div id="hud">

    <div class="box">
        🏁 Position:
        <span id="position">1</span>/4
    </div>

    <div class="box">
        🏎️ Speed:
        <span id="speed">0</span>
    </div>

        💨 Nitro:
        <span id="nitroValue">100</span>%
    </div>

</div>


<div id="controls">

<div id="countdown"></div>


<div id="startScreen">

    <div class="panel">

        <div style="font-size:70px">🏎️</div>

        <p>

        </p>

        <p>
            💻 <b>Laptop</b><br>

<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================
   BASIC THREE.JS SETUP
========================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x75c9ff);

scene.fog = new THREE.Fog(
    0x75c9ff,
    70,
    260
);


const camera = new THREE.PerspectiveCamera(
    65,
    innerWidth / innerHeight,
    0.1,
    500
);

camera.position.set(
    0,
    5,
    10
);


const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setPixelRatio(
    Math.min(devicePixelRatio, 2)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled = true;

document
    .getElementById("game")
    .appendChild(renderer.domElement);


/* =========================================
   LIGHTING
========================================= */

const skyLight =
    new THREE.HemisphereLight(
        0xffffff,
        0x557755,
        2
    );

scene.add(skyLight);


const sunLight =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sunLight.position.set(
    50,
    80,
    30
);

sunLight.castShadow = true;

scene.add(sunLight);


/* =========================================
   WORLD
========================================= */

const world =
    new THREE.Group();

scene.add(world);


/* GRASS */

const grassGeometry =
    new THREE.PlaneGeometry(
        500,
        500
    );

const grassMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x3d8f45
    });

const grass =
    new THREE.Mesh(
        grassGeometry,
        grassMaterial
    );

grass.rotation.x =
    -Math.PI / 2;

grass.position.y =
    -0.15;

grass.receiveShadow = true;

world.add(grass);


/* =========================================
   TRACK
========================================= */

const trackWidth = 14;

const trackLength = 240;


/* ROAD */

const roadGeometry =
    new THREE.PlaneGeometry(
        trackWidth,
        trackLength
    );

const roadMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x33343a
    });

const road =
    new THREE.Mesh(
        roadGeometry,
        roadMaterial
    );

road.rotation.x =
    -Math.PI / 2;

road.position.z =
    -trackLength / 2;

road.receiveShadow = true;

world.add(road);


/* =========================================
   ROAD EDGES
========================================= */

function createBarrier(x) {

    const geometry =
        new THREE.BoxGeometry(
            .7,
            .5,
            trackLength
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0xffcc00
        });

    const barrier =
        new THREE.Mesh(
            geometry,
            material
        );

    barrier.position.set(
        x,
        .25,
        -trackLength / 2
    );

    barrier.castShadow = true;

    world.add(barrier);
}

createBarrier(-7.4);
createBarrier(7.4);


/* =========================================
   ROAD LANE MARKINGS
========================================= */

for (
    let z = -5;
    z > -trackLength;
    z -= 10
) {

    const lineGeometry =
        new THREE.BoxGeometry(
            .15,
            .03,
            5
        );

    const lineMaterial =
        new THREE.MeshBasicMaterial({
            color: 0xffffff
        });

    const line =
        new THREE.Mesh(
            lineGeometry,
            lineMaterial
        );

    line.position.set(
        0,
        .025,
        z
    );

    world.add(line);
}


/* =========================================
   START / FINISH LINE
========================================= */

const finishGeometry =
    new THREE.PlaneGeometry(
        trackWidth,
        5
    );

const finishMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xffffff
    });

const finish =
    new THREE.Mesh(
        finishGeometry,
        finishMaterial
    );

finish.rotation.x =
    -Math.PI / 2;

finish.position.set(
    0,
    .04,
    -trackLength + 15
);

world.add(finish);


/* =========================================
   TREE CREATOR
========================================= */

function createTree(x, z) {

    const tree =
        new THREE.Group();


    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .25,
                .35,
                2.5,
                8
            ),
            new THREE.MeshStandardMaterial({
                color: 0x75452c
            })
        );

    trunk.position.y =
        1.25;

    tree.add(trunk);


    const leaves =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                1.5,
                3.5,
                8
            ),
            new THREE.MeshStandardMaterial({
                color: 0x176b35
            })
        );

    leaves.position.y =
        3.5;

    tree.add(leaves);


    tree.position.set(
        x,
        0,
        z
    );

    world.add(tree);
}


/* TREES */

for (
    let z = -10;
    z > -trackLength;
    z -= 14
) {

    createTree(
        -11 - Math.random() * 4,
        z
    );

    createTree(
        11 + Math.random() * 4,
        z - 5
    );
}


/* =========================================
   CAR CREATOR
========================================= */

function createCar(color) {

    const car =
        new THREE.Group();


    /* BODY */

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.2,
                .65,
                4
            ),
            new THREE.MeshStandardMaterial({
                color: color
            })
        );

    body.position.y =
        .75;

    body.castShadow = true;

    car.add(body);


    /* TOP */

    const top =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.55,
                .55,
                1.8
            ),
            new THREE.MeshStandardMaterial({
                color: color
            })
        );

    top.position.set(
        0,
        1.15,
        .15
    );

    top.castShadow = true;

    car.add(top);


    /* WINDOWS */

    const windowMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x78d8ff,
            metalness: .2,
            roughness: .2
        });


    const frontWindow =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.3,
                .35,
                .05
            ),
            windowMaterial
        );

    frontWindow.position.set(
        0,
        1.18,
        -.78
    );

    car.add(frontWindow);


    /* WHEELS */

    const wheelMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x111111
        });


    const wheelPositions = [
        [-1.15, .45, -1.25],
        [1.15, .45, -1.25],
        [-1.15, .45, 1.25],
        [1.15, .45, 1.25]
    ];


    wheelPositions.forEach(
        position => {

            const wheel =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        .43,
                        .43,
                        .28,
                        16
                    ),
                    wheelMaterial
                );

            wheel.rotation.z =
                Math.PI / 2;

            wheel.position.set(
                ...position
            );

            wheel.castShadow = true;

            car.add(wheel);
        }
    );


    return car;
}


/* =========================================
   PLAYER
========================================= */

const player =
    createCar(0xff3030);

player.position.set(
    0,
    0,
    -5
);

world.add(player);


/* =========================================
   OPPONENTS
========================================= */

const opponents = [];

const opponentColors = [
    0x246bff,
    0xff8c00,
    0x9b30ff
];


for (let i = 0; i < 3; i++) {

    const enemy =
        createCar(
            opponentColors[i]
        );

    enemy.position.set(
        (i - 1) * 3.2,
        0,
        -25 - i * 18
    );

    world.add(enemy);

    opponents.push({
        mesh: enemy,
        speed: 0.18 + Math.random() * .05,
        lane: i - 1
    });
}


/* =========================================
   GAME VARIABLES
========================================= */

let running = false;

let accelerate = false;

let leftPressed = false;

let rightPressed = false;

let nitroPressed = false;

let playerSpeed = 0;

let nitro = 100;

let distance = 0;

let raceFinished = false;


/* =========================================
   KEYBOARD
========================================= */

document.addEventListener(
    "keydown",
    e => {

        if (e.code === "Space") {

            e.preventDefault();

            accelerate = true;
        }

        if (e.key === "ArrowLeft") {

            leftPressed = true;
        }

        if (e.key === "ArrowRight") {

            rightPressed = true;
        }

        if (e.code === "ShiftLeft" ||
            e.code === "ShiftRight") {

            nitroPressed = true;
        }
    }
);


document.addEventListener(
    "keyup",
    e => {

        if (e.code === "Space") {

            accelerate = false;
        }

        if (e.key === "ArrowLeft") {

            leftPressed = false;
        }

        if (e.key === "ArrowRight") {

            rightPressed = false;
        }

        if (e.code === "ShiftLeft" ||
            e.code === "ShiftRight") {

            nitroPressed = false;
        }
    }
);


/* =========================================
   TOUCH
========================================= */

function hold(
    element,
    down,
    up
) {

    element.addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();

            down();
        }
    );

    element.addEventListener(
        "pointerup",
        e => {

            e.preventDefault();

            up();
        }
    );

    element.addEventListener(
        "pointercancel",
        up
    );

    element.addEventListener(
        "pointerleave",
        up
    );
}


hold(
    document.getElementById("left"),
    () => leftPressed = true,
    () => leftPressed = false
);


hold(
    document.getElementById("right"),
    () => rightPressed = true,
    () => rightPressed = false
);


hold(
    document.getElementById("nitro"),
    () => nitroPressed = true,
    () => nitroPressed = false
);


/* =========================================
   RESET CARS
========================================= */

function resetCars() {

    player.position.x = 0;
    player.position.z = -5;

    opponents.forEach(
        (enemy, i) => {

            enemy.mesh.position.x =
                (i - 1) * 3.2;

            enemy.mesh.position.z =
                -25 - i * 18;
        }
    );
}


/* =========================================
   START
========================================= */

async function startGame() {

    document
        .getElementById("startScreen")
        .classList.add("hidden");

    document
        .getElementById("gameOver")
        .classList.add("hidden");

    resetCars();

    playerSpeed = 0;

    nitro = 100;

    distance = 0;

    raceFinished = false;

    running = false;

    await countdown();

    running = true;

    animate();
}


/* =========================================
   COUNTDOWN
========================================= */

function countdown() {

    return new Promise(resolve => {

        const display =
            document.getElementById(
                "countdown"
            );

        let number = 3;

        display.textContent = number;

        const timer =
            setInterval(() => {

                number--;

                if (number > 0) {

                    display.textContent =
                        number;

                } else {

                    display.textContent =
                        "GO!";

                    setTimeout(() => {

                        display.textContent =
                            "";

                        clearInterval(timer);

                        resolve();

                    }, 600);
                }

            }, 700);
    });
}


/* =========================================
   COLLISION
========================================= */

function checkCollision(
    a,
    b
) {

    const boxA =
        new THREE.Box3()
            .setFromObject(a);

    const boxB =
        new THREE.Box3()
            .setFromObject(b);

    return boxA.intersectsBox(boxB);
}


/* =========================================
   GAME UPDATE
========================================= */

function update() {

    if (!running)
        return;


    /* ACCELERATE */

    if (accelerate) {

        playerSpeed += .012;

    } else {

        playerSpeed -= .008;
    }


    /* NITRO */

    if (
        nitroPressed &&
        nitro > 0 &&
        playerSpeed > .1
    ) {

        playerSpeed += .035;

        nitro -= .5;

    } else {

        nitro += .08;
    }


    nitro =
        Math.max(
            0,
            Math.min(100, nitro)
        );


    /* SPEED LIMIT */

    playerSpeed =
        Math.max(
            0,
            Math.min(
                nitroPressed ? .85 : .55,
                playerSpeed
            )
        );


    /* STEERING */

    if (leftPressed) {

        player.position.x -=
            .16 + playerSpeed * .18;

        player.rotation.y =
            .12;

    } else if (rightPressed) {

        player.position.x +=
            .16 + playerSpeed * .18;

        player.rotation.y =
            -.12;

    } else {

        player.rotation.y *= .85;
    }


    /* ROAD LIMIT */

    player.position.x =
        Math.max(
            -5.5,
            Math.min(
                5.5,
                player.position.x
            )
        );


    /* MOVE PLAYER */

    player.position.z -=
        playerSpeed;


    distance +=
        playerSpeed;


    /* OPPONENTS */

    opponents.forEach(
        enemy => {

            enemy.mesh.position.z -=
                enemy.speed;


            /*
              When an opponent goes behind
              the camera, recycle it ahead.
            */

            if (
                enemy.mesh.position.z >
                player.position.z + 30
            ) {

                enemy.mesh.position.z =
                    player.position.z - 120;

                enemy.mesh.position.x =
                    (Math.floor(
                        Math.random() * 3
                    ) - 1) * 3.2;
            }


            /* COLLISION */

            if (
                checkCollision(
                    player,
                    enemy.mesh
                )
            ) {

                playerSpeed *= .35;

                player.position.x +=
                    player.position.x <
                    enemy.mesh.position.x
                    ? -0.25
                    : 0.25;
            }

        }
    );


    /* CAMERA */

    camera.position.x +=
        (
            player.position.x -
            camera.position.x
        ) * .08;

    camera.position.y +=
        (
            5 -
            camera.position.y
        ) * .08;

    camera.position.z +=
        (
            player.position.z + 10 -
            camera.position.z
        ) * .08;


    camera.lookAt(
        player.position.x,
        1,
        player.position.z - 12
    );


    /* FINISH */

    if (
        distance >=
        trackLength - 30
    ) {

        finishRace();

        return;
    }


    /* HUD */

    document.getElementById(
        "speed"
    ).textContent =
        Math.floor(
            playerSpeed * 240
        );

    document.getElementById(
        "nitroValue"
    ).textContent =
        Math.floor(nitro);


    /* POSITION */

    let position = 1;

    opponents.forEach(
        enemy => {

            if (
                enemy.mesh.position.z >
                player.position.z
            ) {

                position++;
            }
        }
    );

    document.getElementById(
        "position"
    ).textContent =
        Math.min(position, 4);
}


/* =========================================
   FINISH
========================================= */

function finishRace() {

    running = false;

    raceFinished = true;

    let position = 1;

    opponents.forEach(
        enemy => {

            if (
                enemy.mesh.position.z >
                player.position.z
            ) {

                position++;
            }
        }
    );


    const suffix =
        position === 1
        ? "st"
        : position === 2
        ? "nd"
        : position === 3
        ? "rd"
        : "th";


    document.getElementById(
        "finalPosition"
    ).textContent =
        position + suffix;


    document
        .getElementById("gameOver")
        .classList.remove("hidden");
}


/* =========================================
   GAME LOOP
========================================= */

function animate() {

    if (!running)
        return;

    requestAnimationFrame(
        animate
    );

    update();

    renderer.render(
        scene,
        camera
    );
}


/* =========================================
   BUTTONS
========================================= */

document
    .getElementById("startButton")
    .addEventListener(
        "click",
        startGame
    );


document
    .getElementById("againButton")
    .addEventListener(
        "click",
        startGame
    );


/* =========================================
   RESIZE
========================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth / innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


/* =========================================
   INITIAL RENDER
========================================= */

renderer.render(
    scene,
    camera
);

</script>

</body>
</html>
